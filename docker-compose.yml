services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signallab
      POSTGRES_PASSWORD: signallab
      POSTGRES_DB: signallab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signallab"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
